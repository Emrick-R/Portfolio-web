<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Emrick RIVET — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
    <style>
        /* ─── Design tokens — Material / Teal ──────────────────── */
        :root {
            --bg:         #FAFAFA;
            --surface:    #FFFFFF;
            --surface-2:  #F5F5F5;
            --divider:    #E0E0E0;
            --on-bg:      #212121;
            --on-bg-2:    #616161;
            --on-bg-3:    #9E9E9E;
            --teal:       #00897B;
            --teal-light: #E0F2F1;
            --teal-dark:  #00695C;
            --on-teal:    #FFFFFF;
            --z1: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
            --z2: 0 3px 6px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.08);
            --z4: 0 6px 16px rgba(0,0,0,.10), 0 3px 6px rgba(0,0,0,.06);
            --radius:  8px;
            --radius-s: 4px;
            --max-w:   1120px;
            --nav-h:   64px;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg:         #121212;
                --surface:    #1E1E1E;
                --surface-2:  #2C2C2C;
                --divider:    #2E2E2E;
                --on-bg:      #EEEEEE;
                --on-bg-2:    #BDBDBD;
                --on-bg-3:    #757575;
                --teal:       #26A69A;
                --teal-light: #1A2F2D;
                --teal-dark:  #4DB6AC;
                --z1: 0 1px 3px rgba(0,0,0,.32), 0 1px 2px rgba(0,0,0,.24);
                --z2: 0 3px 6px rgba(0,0,0,.30), 0 2px 4px rgba(0,0,0,.22);
                --z4: 0 6px 16px rgba(0,0,0,.34), 0 3px 6px rgba(0,0,0,.20);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg:         #121212;
            --surface:    #1E1E1E;
            --surface-2:  #2C2C2C;
            --divider:    #2E2E2E;
            --on-bg:      #EEEEEE;
            --on-bg-2:    #BDBDBD;
            --on-bg-3:    #757575;
            --teal:       #26A69A;
            --teal-light: #1A2F2D;
            --teal-dark:  #4DB6AC;
            --z1: 0 1px 3px rgba(0,0,0,.32), 0 1px 2px rgba(0,0,0,.24);
            --z2: 0 3px 6px rgba(0,0,0,.30), 0 2px 4px rgba(0,0,0,.22);
            --z4: 0 6px 16px rgba(0,0,0,.34), 0 3px 6px rgba(0,0,0,.20);
            color-scheme: dark;
        }

        /* ─── Reset ─────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            background: var(--bg);
            color: var(--on-bg);
            padding-left:  max(16px, env(safe-area-inset-left,  0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            padding-block: 0;
        }

        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; display: block; }

        /* ─── Nav ────────────────────────────────────────────────── */
        #nav {
            position: sticky;
            top: 0;
            height: var(--nav-h);
            background: var(--surface);
            box-shadow: var(--z1);
            z-index: 100;
        }

        .nav-inner {
            max-width: var(--max-w);
            width: 100%;
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -.5px;
            color: var(--on-bg);
            margin-right: auto;
        }
        .nav-logo span { color: var(--teal); }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
        }
        .nav-links a {
            font-size: .875rem;
            font-weight: 500;
            color: var(--on-bg-2);
            padding: 8px 12px;
            border-radius: var(--radius-s);
            transition: color .15s, background .15s;
        }
        .nav-links a:hover { color: var(--teal); background: var(--teal-light); }

        .nav-controls { display: flex; gap: 4px; margin-left: 8px; }

        .icon-btn {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            color: var(--on-bg-2);
            font-size: .875rem;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            transition: background .15s, color .15s;
        }
        .icon-btn:hover { background: var(--teal-light); color: var(--teal); }

        @media (max-width: 640px) { .nav-links { display: none; } }

        /* ─── Layout helper ──────────────────────────────────────── */
        .container { max-width: var(--max-w); margin: 0 auto; }

        section { padding: 80px 0; }
        section:nth-of-type(even) { background: var(--surface-2); }

        /* ─── Section header ─────────────────────────────────────── */
        .section-header { margin-bottom: 48px; }

        .section-eyebrow {
            font-size: .75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--teal);
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--on-bg);
            text-wrap: balance;
        }

        /* ─── Hero ───────────────────────────────────────────────── */
        #hero {
            background: var(--surface);
            padding: 96px 0 80px;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: .8125rem;
            font-weight: 500;
            color: var(--teal);
            background: var(--teal-light);
            padding: 4px 12px;
            border-radius: 100px;
            margin-bottom: 24px;
        }
        .hero-eyebrow::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--teal);
            flex-shrink: 0;
        }

        .hero-name {
            font-size: clamp(2.5rem, 6vw, 3.75rem);
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1.1;
            color: var(--on-bg);
            margin-bottom: 8px;
        }
        .hero-name .accent { color: var(--teal); }

        .hero-role {
            font-size: .875rem;
            color: var(--on-bg-3);
            font-family: 'Roboto Mono', monospace;
            margin-bottom: 20px;
        }

        .hero-subtitle {
            font-size: 1.0625rem;
            color: var(--on-bg-2);
            max-width: 560px;
            line-height: 1.7;
            margin-bottom: 36px;
        }

        .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }

        /* ─── Buttons ────────────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            padding: 0 20px;
            border-radius: var(--radius-s);
            font-family: 'Roboto', sans-serif;
            font-size: .875rem;
            font-weight: 500;
            letter-spacing: .25px;
            cursor: pointer;
            border: none;
            transition: box-shadow .2s, background .15s, color .15s;
            text-decoration: none;
        }
        .btn-primary { background: var(--teal); color: var(--on-teal); }
        .btn-primary:hover { box-shadow: var(--z2); background: var(--teal-dark); }
        .btn-outline { background: transparent; color: var(--teal); border: 1.5px solid var(--teal); }
        .btn-outline:hover { background: var(--teal-light); }

        /* ─── About ──────────────────────────────────────────────── */
        .about-grid {
            display: flex;
            gap: 48px;
            align-items: flex-start;
        }

        .about-photo-wrap { flex: 0 0 200px; max-width: 200px; }

        .about-photo {
            width: 100%;
            aspect-ratio: 1;
            border-radius: var(--radius);
            object-fit: cover;
            box-shadow: var(--z2);
        }

        .about-photo-placeholder {
            width: 100%;
            aspect-ratio: 1;
            border-radius: var(--radius);
            background: var(--teal-light);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--z2);
        }
        .about-photo-placeholder svg { width: 56px; height: 56px; color: var(--teal); }

        .about-content { flex: 1; min-width: 0; }

        .about-paragraphs {
            display: flex;
            flex-direction: column;
            gap: 16px;
            color: var(--on-bg-2);
            line-height: 1.75;
            margin-bottom: 28px;
        }
        .about-paragraphs p strong { color: var(--on-bg); font-weight: 500; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            font-size: .8125rem;
            font-weight: 500;
            color: var(--teal);
            background: var(--teal-light);
            padding: 4px 12px;
            border-radius: 100px;
        }

        @media (max-width: 700px) {
            .about-grid { flex-direction: column; }
            .about-photo-wrap { flex: none; max-width: 140px; }
        }

        /* ─── Projects ───────────────────────────────────────────── */
        .projects-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }

        .filter-chip {
            font-size: .8125rem;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 100px;
            border: 1.5px solid var(--divider);
            background: transparent;
            color: var(--on-bg-2);
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            transition: all .15s;
        }
        .filter-chip.active, .filter-chip:hover {
            border-color: var(--teal);
            color: var(--teal);
            background: var(--teal-light);
        }

        .projects-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: flex-start;
        }

        .project-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--z1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow .2s, transform .2s;
            flex: 1 1 300px;
            min-width: 0;
            max-width: 460px;
            border: 1px solid var(--divider);
        }
        .project-card:hover { box-shadow: var(--z4); transform: translateY(-2px); }
        .project-card.featured { border-top: 3px solid var(--teal); }

        .project-body {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .project-type {
            font-size: .75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--on-bg-3);
        }
        .project-card.featured .project-type { color: var(--teal); }

        .project-name { font-size: 1.0625rem; font-weight: 700; color: var(--on-bg); }

        .project-role {
            font-size: .8125rem;
            color: var(--on-bg-3);
            font-family: 'Roboto Mono', monospace;
        }

        .project-desc { font-size: .9375rem; color: var(--on-bg-2); line-height: 1.65; flex: 1; }

        .project-stack { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .stack-tag {
            font-family: 'Roboto Mono', monospace;
            font-size: .75rem;
            color: var(--on-bg-3);
            background: var(--surface-2);
            border: 1px solid var(--divider);
            padding: 2px 8px;
            border-radius: var(--radius-s);
        }

        .project-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 14px 24px;
            border-top: 1px solid var(--divider);
            background: var(--surface-2);
        }

        .project-link {
            font-size: .8125rem;
            font-weight: 500;
            color: var(--teal);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius-s);
            border: 1px solid var(--teal);
            transition: background .15s;
        }
        .project-link:hover { background: var(--teal-light); }

        /* ─── Skills ─────────────────────────────────────────────── */
        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .skill-group {
            background: var(--surface);
            border: 1px solid var(--divider);
            border-radius: var(--radius);
            padding: 20px 24px;
            flex: 1 1 220px;
            min-width: 0;
        }

        .skill-group-title {
            font-size: .75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--teal);
            margin-bottom: 14px;
        }

        .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }

        .skill-tag {
            font-family: 'Roboto Mono', monospace;
            font-size: .8rem;
            color: var(--on-bg-2);
            background: var(--surface-2);
            border: 1px solid var(--divider);
            padding: 3px 10px;
            border-radius: var(--radius-s);
        }

        /* ─── Contact ────────────────────────────────────────────── */
        #contact { text-align: center; }
        #contact .section-header { margin-bottom: 16px; }

        .contact-desc {
            color: var(--on-bg-2);
            max-width: 480px;
            margin: 0 auto 32px;
            line-height: 1.7;
        }

        .contact-email-block { margin-bottom: 24px; }

        .contact-email {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            color: var(--on-bg);
            background: var(--surface);
            border: 1px solid var(--divider);
            border-radius: var(--radius);
            padding: 12px 20px;
            cursor: pointer;
            transition: border-color .15s, box-shadow .15s;
            box-shadow: var(--z1);
        }
        .contact-email:hover { border-color: var(--teal); }

        .copy-hint { font-size: .75rem; color: var(--on-bg-3); margin-top: 6px; }
        .copy-hint.copied { color: var(--teal); }

        .contact-links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

        /* ─── Footer ─────────────────────────────────────────────── */
        #footer {
            background: var(--surface);
            border-top: 1px solid var(--divider);
            padding: 20px 0;
        }

        .footer-inner {
            max-width: var(--max-w);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .footer-copy { font-size: .8125rem; color: var(--on-bg-3); }
        .footer-copy a { color: var(--teal); }
        .footer-copy a:hover { text-decoration: underline; }

        /* ─── Reveal animation ───────────────────────────────────── */
        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .4s ease, transform .4s ease;
        }
        .reveal.visible { opacity: 1; transform: none; }

        @media (prefers-reduced-motion: reduce) {
            .reveal { opacity: 1; transform: none; transition: none; }
        }
    </style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
    <div class="nav-inner container">
        <span class="nav-logo" id="nav-logo">ER<span>.</span></span>
        <ul class="nav-links" id="nav-links"></ul>
        <div class="nav-controls">
            <button class="icon-btn" id="lang-btn" aria-label="Changer de langue">FR</button>
            <button class="icon-btn" id="theme-btn" aria-label="Changer de thème">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
        </div>
    </div>
</nav>

<!-- HERO -->
<section id="hero">
    <div class="container">
        <div class="hero-eyebrow reveal" id="hero-eyebrow"></div>
        <h1 class="hero-name reveal" id="hero-name">Emrick <span class="accent">RIVET</span></h1>
        <p class="hero-role reveal" id="hero-role"></p>
        <p class="hero-subtitle reveal" id="hero-subtitle"></p>
        <div class="hero-actions reveal" id="hero-actions"></div>
    </div>
</section>

<!-- ABOUT -->
<section id="about">
    <div class="container">
        <div class="section-header reveal">
            <div class="section-eyebrow" id="about-eyebrow"></div>
            <h2 class="section-title" id="about-title"></h2>
        </div>
        <div class="about-grid">
            <div class="about-photo-wrap reveal">
                <div id="about-photo-slot">
                    <div class="about-photo-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 7.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                        </svg>
                    </div>

            </div>

                <div class="about-paragraphs reveal" id="about-paragraphs"></div>

            </div>

</section>

<!-- PROJECTS -->
<section id="projects">
    <div class="container">
        <div class="section-header reveal">
            <div class="section-eyebrow" id="projects-eyebrow"></div>
            <h2 class="section-title" id="projects-title"></h2>
        </div>
        <div class="projects-filter reveal" id="projects-filter"></div>
        <div class="projects-grid" id="projects-grid"></div>
    </div>
</section>

<!-- SKILLS -->
<section id="skills">
    <div class="container">
        <div class="section-header reveal">
            <div class="section-eyebrow" id="skills-eyebrow"></div>
            <h2 class="section-title" id="skills-title"></h2>
        </div>
        <div class="skills-grid" id="skills-grid"></div>
    </div>
</section>

<!-- CONTACT -->
<section id="contact">
    <div class="container">
        <div class="section-header reveal">
            <div class="section-eyebrow" id="contact-eyebrow"></div>
            <h2 class="section-title" id="contact-title"></h2>
        </div>
        <p class="contact-desc reveal" id="contact-desc"></p>
        <div class="reveal">
            <div class="contact-email-block">
                <div class="contact-email" id="contact-email-btn" tabindex="0" role="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>
                    <span id="contact-email-text"></span>
                </div>
                <div class="copy-hint" id="copy-hint">Cliquer pour copier</div>
            </div>
            <div class="contact-links" id="contact-links"></div>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer id="footer">
    <div class="footer-inner container">
        <p class="footer-copy" id="footer-copy"></p>
        <p class="footer-copy" id="footer-repo"></p>
    </div>
</footer>

<script>
    /* ── State ───────────────────────────────── */
    let lang = 'fr';
    let data = null;
    let activeFilter = 'all';

    try { lang = localStorage.getItem('lang') || 'fr'; } catch(e) {}

    /* ── Theme ───────────────────────────────── */
    (function() {
        let saved; try { saved = localStorage.getItem('theme'); } catch(e) {}
        if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();

    document.getElementById('theme-btn').addEventListener('click', () => {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch(e) {}
    });

    /* ── Translation helper ──────────────────── */
    function t(val) {
        if (!val) return '';
        if (typeof val === 'string') return val;
        if (typeof val === 'object') return val[lang] ?? val.fr ?? val.en ?? '';
        return String(val);
    }

    /* ── Render all ──────────────────────────── */
    function render(d) {
        renderNav(d.nav);
        renderHero(d.hero);
        renderAbout(d.about);
        renderProjects(d.projects);
        renderSkills(d.skills);
        renderContact(d.contact);
        renderFooter(d.footer);
        // initReveal est appelé une seule fois après le premier render (voir boot)
    }

    function renderNav(nav) {
        const ul = document.getElementById('nav-links');
        ul.innerHTML = '';
        nav.links.forEach(link => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = link.href;
            a.textContent = t(link.label);
            li.appendChild(a);
            ul.appendChild(li);
        });
        document.getElementById('lang-btn').textContent = lang === 'fr' ? 'EN' : 'FR';
    }

    function renderHero(hero) {
        document.getElementById('hero-eyebrow').textContent = t(hero.eyebrow);
        document.getElementById('hero-role').textContent = t(hero.role);
        document.getElementById('hero-subtitle').textContent = t(hero.subtitle);
        const actEl = document.getElementById('hero-actions');
        actEl.innerHTML = '';
        hero.buttons.forEach(btn => {
            const a = document.createElement('a');
            a.href = btn.href;
            a.textContent = t(btn.label);
            a.className = 'btn btn-' + btn.style;
            if (btn.href && btn.href.startsWith('http')) { a.target = '_blank'; a.rel = 'noopener'; }
            actEl.appendChild(a);
        });
    }

    function renderAbout(about) {
        document.getElementById('about-eyebrow').textContent = t(about.sectionLabel);
        document.getElementById('about-title').textContent = t(about.sectionTitle);

        if (about.photo) {
            const slot = document.getElementById('about-photo-slot');
            const img = document.createElement('img');
            img.src = about.photo;
            img.alt = 'Emrick RIVET';
            img.className = 'about-photo';
            img.onerror = function() { this.hidden = true; };
            slot.innerHTML = '';
            slot.appendChild(img);
        }

        const paras = document.getElementById('about-paragraphs');
        paras.innerHTML = '';
        const arr = about.paragraphs[lang] || about.paragraphs.fr || [];
        arr.forEach(p => { const el = document.createElement('p'); el.innerHTML = p; paras.appendChild(el); });

        const chipsEl = document.getElementById('about-chips');
        chipsEl.innerHTML = '';
        about.chips.forEach(c => {
            const span = document.createElement('span');
            span.className = 'chip';
            span.textContent = t(c.label);
            chipsEl.appendChild(span);
        });
    }

    function renderProjects(projects) {
        document.getElementById('projects-eyebrow').textContent = t(projects.sectionLabel);
        document.getElementById('projects-title').textContent = t(projects.sectionTitle);

        const filterEl = document.getElementById('projects-filter');
        filterEl.innerHTML = '';

        const filters = [
            { key: 'all',      label: { fr: 'Tous', en: 'All' } },
            { key: 'featured', label: { fr: '⭐ Mis en avant', en: '⭐ Featured' } }
        ];

        filters.forEach(f => {
            const btn = document.createElement('button');
            btn.className = 'filter-chip' + (activeFilter === f.key ? ' active' : '');
            btn.textContent = t(f.label);
            btn.addEventListener('click', () => { activeFilter = f.key; renderProjects(data.projects); });
            filterEl.appendChild(btn);
        });

        const grid = document.getElementById('projects-grid');
        grid.innerHTML = '';
        const items = activeFilter === 'featured'
            ? projects.items.filter(p => p.featured)
            : projects.items;

        items.forEach(proj => {
            const card = document.createElement('div');
            card.className = 'project-card reveal' + (proj.featured ? ' featured' : '');

            const body = document.createElement('div');
            body.className = 'project-body';

            if (proj.type) {
                const typeEl = document.createElement('div');
                typeEl.className = 'project-type';
                typeEl.textContent = t(proj.type);
                body.appendChild(typeEl);
            }

            const nameEl = document.createElement('div');
            nameEl.className = 'project-name';
            nameEl.textContent = proj.name;
            body.appendChild(nameEl);

            if (proj.role) {
                const roleEl = document.createElement('div');
                roleEl.className = 'project-role';
                roleEl.textContent = t(proj.role);
                body.appendChild(roleEl);
            }

            const descEl = document.createElement('p');
            descEl.className = 'project-desc';
            descEl.textContent = t(proj.description);
            body.appendChild(descEl);

            if (proj.stack && proj.stack.length) {
                const stackEl = document.createElement('div');
                stackEl.className = 'project-stack';
                proj.stack.forEach(tag => {
                    const s = document.createElement('span');
                    s.className = 'stack-tag';
                    s.textContent = tag;
                    stackEl.appendChild(s);
                });
                body.appendChild(stackEl);
            }

            card.appendChild(body);

            if (proj.links && proj.links.length) {
                const linksEl = document.createElement('div');
                linksEl.className = 'project-links';
                proj.links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.href;
                    a.className = 'project-link';
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.textContent = t(link.label);
                    linksEl.appendChild(a);
                });
                card.appendChild(linksEl);
            }

            grid.appendChild(card);
        });

        // Observer les nouvelles cartes injectées par le filtre
        if (revealObserver) {
            grid.querySelectorAll('.reveal').forEach(el => {
                el.classList.remove('visible');
                revealObserver.observe(el);
            });
        }
    }

    function renderSkills(skills) {
        document.getElementById('skills-eyebrow').textContent = t(skills.sectionLabel);
        document.getElementById('skills-title').textContent = t(skills.sectionTitle);

        const grid = document.getElementById('skills-grid');
        grid.innerHTML = '';
        skills.groups.forEach(group => {
            const card = document.createElement('div');
            card.className = 'skill-group reveal';
            const titleEl = document.createElement('div');
            titleEl.className = 'skill-group-title';
            titleEl.textContent = t(group.title);
            card.appendChild(titleEl);
            const tags = document.createElement('div');
            tags.className = 'skill-tags';
            group.tags.forEach(tag => {
                const span = document.createElement('span');
                span.className = 'skill-tag';
                span.textContent = tag;
                tags.appendChild(span);
            });
            card.appendChild(tags);
            grid.appendChild(card);
        });
    }

    function renderContact(contact) {
        document.getElementById('contact-eyebrow').textContent = t(contact.sectionLabel);
        document.getElementById('contact-title').textContent = t(contact.sectionTitle);
        document.getElementById('contact-desc').textContent = t(contact.description);
        document.getElementById('contact-email-text').textContent = contact.email;

        const hint = document.getElementById('copy-hint');
        hint.textContent = lang === 'fr' ? 'Cliquer pour copier' : 'Click to copy';

        const emailBtn = document.getElementById('contact-email-btn');
        emailBtn.onclick = () => {
            navigator.clipboard.writeText(contact.email).then(() => {
                hint.textContent = lang === 'fr' ? '✓ Copié !' : '✓ Copied!';
                hint.classList.add('copied');
                setTimeout(() => {
                    hint.classList.remove('copied');
                    hint.textContent = lang === 'fr' ? 'Cliquer pour copier' : 'Click to copy';
                }, 2000);
            }).catch(() => {
                const range = document.createRange();
                range.selectNode(document.getElementById('contact-email-text'));
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
            });
        };
        emailBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') emailBtn.click(); });

        const linksEl = document.getElementById('contact-links');
        linksEl.innerHTML = '';
        contact.links.forEach(link => {
            const a = document.createElement('a');
            a.href = link.href;
            a.className = 'btn btn-outline';
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = link.label;
            linksEl.appendChild(a);
        });
    }

    function renderFooter(footer) {
        document.getElementById('footer-copy').textContent = `© ${footer.year} ${footer.name}`;
        document.getElementById('footer-repo').innerHTML = `<a href="${footer.repoUrl}" target="_blank" rel="noopener">Source GitHub</a>`;
    }

    /* ── Reveal ──────────────────────────────── */
    // Observer global pour pouvoir observer les cartes injectées dynamiquement (filtre projets)
    let revealObserver = null;

    function initReveal() {
        revealObserver = new IntersectionObserver(entries => {
            entries.forEach(e => {
                if (e.isIntersecting) { e.target.classList.add('visible'); revealObserver.unobserve(e.target); }
            });
        }, { threshold: 0.08 });
        document.querySelectorAll('.reveal').forEach(el => {
            el.classList.remove('visible');
            revealObserver.observe(el);
        });
    }

    /* ── Lang toggle ─────────────────────────── */
    // Au changement de langue, on re-render sans animation : on ajoute 'visible' à toutes les cartes
    document.getElementById('lang-btn').addEventListener('click', () => {
        lang = lang === 'fr' ? 'en' : 'fr';
        try { localStorage.setItem('lang', lang); } catch(e) {}
        if (data) {
            render(data);
            // Rendre immédiatement visible tout ce qui a été re-créé (pas d'animation au changement de langue)
            document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
        }
    });

    /* ── Boot ────────────────────────────────── */
    // Lit le tag <script id="portfolio-data"> (file://) ou charge data.json (serveur)
    (function() {
        var el = document.getElementById('portfolio-data');
        if (el) {
            try { data = JSON.parse(el.textContent); render(data); initReveal(); } catch(e) { console.error('portfolio-data parse error', e); }
        } else {
            fetch('./data.json')
                .then(function(r) { return r.json(); })
                .then(function(d) { data = d; render(d); initReveal(); })
                .catch(function(e) { console.error('fetch data.json failed', e); });
        }
    })();
</script>
</body>
</html>
