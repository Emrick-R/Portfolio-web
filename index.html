<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F7F8FC; --bg2:    #EEF0F8; --surface: #FFFFFF;
      --border:  #DDE1F0; --text:   #1A1D2E; --muted:   #6B7194;
      --violet:  #6D28D9; --cyan:   #0891B2; --coral:   #EA580C;
      --green:   #059669; --yellow: #D97706; --pink:    #DB2777;
      --blue:    #2563EB;
    }
    [data-theme="dark"] {
      --bg:      #0D0F1A; --bg2:    #13162A; --surface: #1A1D30;
      --border:  #2A2D45; --text:   #E8EAF0; --muted:   #7A7F9A;
      --violet:  #7C3AED; --cyan:   #06B6D4; --coral:   #F97316;
      --green:   #10B981; --yellow: #F59E0B; --pink:    #EC4899;
      --blue:    #3B82F6;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.6; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2.5rem;
      background: rgba(247,248,252,0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    [data-theme="dark"] nav { background: rgba(13,15,26,0.85); }
    .nav-logo { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--text); text-decoration: none; letter-spacing: -0.02em; }
    .nav-logo span { color: var(--violet); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }
    .theme-toggle-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .theme-icon { font-size: 0.9rem; user-select: none; }
    .theme-toggle {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 999px;
      width: 44px; height: 24px; cursor: pointer; position: relative; transition: background 0.3s; flex-shrink: 0;
    }
    .theme-toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--violet); transition: transform 0.3s;
    }
    [data-theme="dark"] .theme-toggle::after { transform: translateX(20px); }

    /* HERO */
    #hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 8rem 2.5rem 4rem; position: relative; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .hero-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.12; }
    [data-theme="dark"] .hero-blob { opacity: 0.18; }
    .blob1 { width: 500px; height: 500px; background: var(--violet); top: -100px; right: -100px; }
    .blob2 { width: 350px; height: 350px; background: var(--cyan);   bottom: 50px; left: -80px; }
    .blob3 { width: 250px; height: 250px; background: var(--coral);  top: 40%; right: 20%; }
    .hero-content { position: relative; z-index: 1; max-width: 800px; }
    .hero-eyebrow {
      font-size: 0.85rem; font-weight: 500; color: var(--cyan); letter-spacing: 0.12em;
      text-transform: uppercase; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.6rem;
    }
    .hero-eyebrow::before { content: ''; display: inline-block; width: 28px; height: 2px; background: var(--cyan); }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.8rem,6vw,5rem); font-weight: 700; line-height: 1.1; letter-spacing: -0.03em; margin-bottom: 1.4rem; }
    .gradient-text { background: linear-gradient(135deg, var(--violet), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-sub { font-size: 1.15rem; color: var(--muted); max-width: 520px; margin-bottom: 2.5rem; line-height: 1.7; }
    .hero-ctas { display: flex; gap: 1rem; flex-wrap: wrap; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.6rem; border-radius: 8px; font-weight: 600; font-size: 0.95rem; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--violet); color: #fff; box-shadow: 0 4px 24px rgba(109,40,217,0.25); }
    .btn-primary:hover { box-shadow: 0 6px 32px rgba(109,40,217,0.4); }
    .btn-outline { border: 1px solid var(--border); color: var(--text); background: var(--surface); }
    .btn-outline:hover { border-color: var(--muted); background: var(--bg2); }

    /* SECTIONS */
    section { padding: 6rem 2.5rem; max-width: 1100px; margin: 0 auto; }
    .section-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--violet); margin-bottom: 0.6rem; }
    .section-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.8rem,3.5vw,2.6rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 3rem; }
    .section-divider { width: 100%; height: 1px; background: var(--border); }

    /* ABOUT */
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start; }
    .about-text p { color: var(--muted); margin-bottom: 1rem; line-height: 1.8; }
    .about-text p strong { color: var(--text); }
    .about-domains { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem; }
    .domain-tag { padding: 0.35rem 0.85rem; border-radius: 999px; font-size: 0.82rem; font-weight: 500; border: 1px solid; }
    .tag-violet { color: var(--violet); border-color: rgba(124,58,237,0.4); background: rgba(124,58,237,0.08); }
    .tag-cyan   { color: var(--cyan);   border-color: rgba(6,182,212,0.4);  background: rgba(6,182,212,0.08); }
    .tag-coral  { color: var(--coral);  border-color: rgba(249,115,22,0.4); background: rgba(249,115,22,0.08); }
    .tag-green  { color: var(--green);  border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.08); }
    .tag-yellow { color: var(--yellow); border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.08); }
    .tag-pink   { color: var(--pink);   border-color: rgba(236,72,153,0.4); background: rgba(236,72,153,0.08); }
    .about-photo { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 4px solid var(--border); box-shadow: 0 8px 32px rgba(109,40,217,0.12); margin-bottom: 1.5rem; display: block; }
    .about-photo-placeholder { width: 160px; height: 160px; border-radius: 50%; background: var(--bg2); border: 4px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.78rem; color: var(--muted); text-align: center; margin-bottom: 1.5rem; line-height: 1.4; padding: 1rem; }

    /* SKILLS */
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }
    .skill-group { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.4rem; }
    .skill-group-title { font-family: 'Space Grotesk', sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
    .skill-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .skill-tag { padding: 0.28rem 0.7rem; border-radius: 6px; font-size: 0.82rem; font-weight: 500; background: var(--bg2); border: 1px solid var(--border); color: var(--text); }

    /* PROJECTS */
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.6rem; position: relative; transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s; transform-style: preserve-3d; cursor: default; overflow: hidden; }
    .project-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 14px 14px 0 0; }
    .project-card:hover { transform: translateY(-4px) rotateX(1.5deg) rotateY(-1deg); box-shadow: 0 16px 48px rgba(0,0,0,0.1); }
    .card-violet::before { background: var(--violet); } .card-violet:hover { border-color: rgba(124,58,237,0.5); box-shadow: 0 16px 48px rgba(124,58,237,0.18); }
    .card-cyan::before   { background: var(--cyan);   } .card-cyan:hover   { border-color: rgba(6,182,212,0.5);  box-shadow: 0 16px 48px rgba(6,182,212,0.15); }
    .card-coral::before  { background: var(--coral);  } .card-coral:hover  { border-color: rgba(249,115,22,0.5); box-shadow: 0 16px 48px rgba(249,115,22,0.15); }
    .card-green::before  { background: var(--green);  } .card-green:hover  { border-color: rgba(16,185,129,0.5); box-shadow: 0 16px 48px rgba(16,185,129,0.15); }
    .card-yellow::before { background: var(--yellow); } .card-yellow:hover { border-color: rgba(245,158,11,0.5); box-shadow: 0 16px 48px rgba(245,158,11,0.12); }
    .card-pink::before   { background: var(--pink);   } .card-pink:hover   { border-color: rgba(236,72,153,0.5); box-shadow: 0 16px 48px rgba(236,72,153,0.15); }
    .card-blue::before   { background: var(--blue);   } .card-blue:hover   { border-color: rgba(37,99,235,0.5);  box-shadow: 0 16px 48px rgba(37,99,235,0.15); }
    .project-type { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    .project-name { font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; font-weight: 700; margin-bottom: 0.6rem; letter-spacing: -0.01em; }
    .project-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.65; margin-bottom: 1.2rem; }
    .project-role { font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.4rem; }
    .project-role::before { content: '👤'; font-size: 0.75rem; }
    .project-stack { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1.4rem; }
    .stack-tag { padding: 0.2rem 0.6rem; border-radius: 5px; font-size: 0.75rem; font-weight: 500; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
    .project-links { display: flex; gap: 0.7rem; flex-wrap: wrap; }
    .project-link { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; font-weight: 600; text-decoration: none; color: var(--muted); padding: 0.3rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; transition: color 0.2s, border-color 0.2s; }
    .project-link:hover { color: var(--text); border-color: var(--muted); }

    /* CONTACT */
    #contact { text-align: center; }
    .contact-wrap { max-width: 560px; margin: 0 auto; }
    .contact-desc { color: var(--muted); margin-bottom: 2rem; font-size: 1.05rem; line-height: 1.75; }
    .contact-links { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }

    /* FOOTER */
    footer { border-top: 1px solid var(--border); padding: 1.8rem 2.5rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; color: var(--muted); }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    /* REVEAL */
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.55s ease, transform 0.55s ease; }
    .reveal.visible { opacity: 1; transform: none; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      nav { padding: 1rem 1.2rem; } .nav-links { gap: 1.2rem; }
      section { padding: 4rem 1.2rem; }
      .about-grid { grid-template-columns: 1fr; gap: 2rem; }
      #hero { padding: 7rem 1.2rem 3rem; }
      footer { flex-direction: column; gap: 0.5rem; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      .project-card { transition: none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="#hero" class="nav-logo" id="nav-logo"></a>
  <ul class="nav-links">
    <li><a href="#about">À propos</a></li>
    <li><a href="#skills">Compétences</a></li>
    <li><a href="#projects">Projets</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
  <div class="theme-toggle-wrap">
    <span class="theme-icon" id="theme-icon">🌙</span>
    <button class="theme-toggle" id="theme-toggle" aria-label="Changer de thème"></button>
  </div>
</nav>

<section id="hero">
  <div class="hero-bg">
    <div class="hero-blob blob1"></div>
    <div class="hero-blob blob2"></div>
    <div class="hero-blob blob3"></div>
  </div>
  <div class="hero-content">
    <div class="hero-eyebrow" id="hero-eyebrow"></div>
    <h1 id="hero-title"></h1>
    <p class="hero-sub" id="hero-sub"></p>
    <div class="hero-ctas" id="hero-ctas"></div>
  </div>
</section>

<div class="section-divider"></div>

<section id="about">
  <div class="reveal">
    <div class="section-label" id="about-label"></div>
    <div class="section-title" id="about-title"></div>
  </div>
  <div class="about-grid reveal">
    <div class="about-text" id="about-col1"></div>
    <div class="about-text" id="about-col2"></div>
  </div>
</section>

<div class="section-divider"></div>

<section id="skills">
  <div class="reveal">
    <div class="section-label" id="skills-label"></div>
    <div class="section-title" id="skills-title"></div>
  </div>
  <div class="skills-grid reveal" id="skills-grid"></div>
</section>

<div class="section-divider"></div>

<section id="projects">
  <div class="reveal">
    <div class="section-label" id="projects-label"></div>
    <div class="section-title" id="projects-title"></div>
  </div>
  <div class="projects-grid" id="projects-grid"></div>
</section>

<div class="section-divider"></div>

<section id="contact">
  <div class="contact-wrap reveal">
    <div class="section-label" id="contact-label"></div>
    <div class="section-title" id="contact-title"></div>
    <p class="contact-desc" id="contact-desc"></p>
    <div class="contact-links" id="contact-links"></div>
  </div>
</section>

<footer>
  <span id="footer-copy"></span>
  <a id="footer-repo" target="_blank">Code source ↗</a>
</footer>

<script>
  // ── THEME TOGGLE ──
  const toggle = document.getElementById('theme-toggle');
  const icon   = document.getElementById('theme-icon');
  const root   = document.documentElement;
  const saved  = localStorage.getItem('theme');
  const initDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (initDark) { root.setAttribute('data-theme', 'dark'); icon.textContent = '☀️'; }
  toggle.addEventListener('click', () => {
    const isDark = root.getAttribute('data-theme') === 'dark';
    if (isDark) { root.removeAttribute('data-theme'); icon.textContent = '🌙'; localStorage.setItem('theme','light'); }
    else        { root.setAttribute('data-theme','dark'); icon.textContent = '☀️'; localStorage.setItem('theme','dark'); }
  });

  // ── CHARGEMENT DU JSON ──
  fetch('data.json')
          .then(r => r.json())
          .then(d => {
            renderNav(d.nav);
            renderHero(d.hero);
            renderAbout(d.about);
            renderSkills(d.skills);
            renderProjects(d.projects);
            renderContact(d.contact);
            renderFooter(d.footer);
            initReveal();
            initTilt();
          })
          .catch(err => console.error('Impossible de charger data.json :', err));

  function renderNav(nav) {
    const logo = document.getElementById('nav-logo');
    logo.innerHTML = nav.logo + '<span>' + nav.logoAccent + '</span>';
  }

  function renderHero(hero) {
    document.getElementById('hero-eyebrow').textContent = hero.eyebrow;
    document.getElementById('hero-title').innerHTML =
            'Salut, je suis<br><span class="gradient-text">' + hero.name + '</span>';
    document.getElementById('hero-sub').textContent = hero.subtitle;
    document.getElementById('hero-ctas').innerHTML = hero.buttons.map(b =>
            `<a href="${b.href}" class="btn btn-${b.style}">${b.label}</a>`
    ).join('');
  }

  function renderAbout(about) {
    document.getElementById('about-label').textContent = about.sectionLabel;
    document.getElementById('about-title').textContent = about.sectionTitle;

    // Colonne 1 : photo + paragraphes + domaines
    const col1 = document.getElementById('about-col1');
    if (about.photo) {
      col1.innerHTML = `<img src="${about.photo}" alt="Photo" class="about-photo">`;
    } else {
      col1.innerHTML = `<div class="about-photo-placeholder">📷<br>assets/photo.jpg</div>`;
    }
    col1.innerHTML += about.paragraphs.map(p => `<p>${p}</p>`).join('');
    col1.innerHTML += `<div class="about-domains">` +
            about.domains.map(d => `<span class="domain-tag tag-${d.color}">${d.label}</span>`).join('') +
            `</div>`;

    // Colonne 2 : paragraphes secondaires
    document.getElementById('about-col2').innerHTML =
            about.paragraphs2.map(p => `<p>${p}</p>`).join('');
  }

  function renderSkills(skills) {
    document.getElementById('skills-label').textContent = skills.sectionLabel;
    document.getElementById('skills-title').textContent = skills.sectionTitle;
    document.getElementById('skills-grid').innerHTML = skills.groups.map(g => `
      <div class="skill-group">
        <div class="skill-group-title">${g.title}</div>
        <div class="skill-tags">
          ${g.tags.map(t => `<span class="skill-tag">${t}</span>`).join('')}
        </div>
      </div>
    `).join('');
  }

  function renderProjects(projects) {
    document.getElementById('projects-label').textContent = projects.sectionLabel;
    document.getElementById('projects-title').textContent = projects.sectionTitle;
    document.getElementById('projects-grid').innerHTML = projects.items.map(p => `
      <div class="project-card card-${p.color} reveal">
        <div class="project-type">${p.type}</div>
        <div class="project-name">${p.name}</div>
        <div class="project-desc">${p.description}</div>
        <div class="project-role">${p.role}</div>
        <div class="project-stack">
          ${p.stack.map(s => `<span class="stack-tag">${s}</span>`).join('')}
        </div>
        <div class="project-links">
          ${p.links.map(l => `<a href="${l.href}" class="project-link" target="_blank" rel="noopener">${l.label}</a>`).join('')}
        </div>
      </div>
    `).join('');
  }

  function renderContact(contact) {
    document.getElementById('contact-label').textContent = contact.sectionLabel;
    document.getElementById('contact-title').textContent = contact.sectionTitle;
    document.getElementById('contact-desc').textContent  = contact.description;
    document.getElementById('contact-links').innerHTML = contact.links.map(l =>
            `<a href="${l.href}" class="btn btn-${l.style}" target="_blank" rel="noopener">${l.label}</a>`
    ).join('');
  }

  function renderFooter(footer) {
    document.getElementById('footer-copy').textContent = `© ${footer.year} ${footer.name}`;
    const repo = document.getElementById('footer-repo');
    repo.href = footer.repoUrl;
  }

  function initReveal() {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(el => { if (el.isIntersecting) el.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  }

  function initTilt() {
    document.querySelectorAll('.project-card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width  - 0.5;
        const y = (e.clientY - r.top)  / r.height - 0.5;
        card.style.transform = `translateY(-4px) rotateX(${-y*6}deg) rotateY(${x*6}deg)`;
      });
      card.addEventListener('mouseleave', () => { card.style.transform = ''; });
    });
  }
</script>
</body>
</html>
